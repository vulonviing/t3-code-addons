<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title description">
  <title id="title">Model Council: independent opinions, peer review, and final synthesis</title>
  <desc id="description">One question and the same frozen context go to two to five models; three are shown. Each model gives an independent opinion. Active members review the same packet of all opinions and the latest earlier positions. Review rounds repeat while needed, until all active members finish or the configured round limit is reached. The model selected in the original chat synthesizes one final answer, preserving unresolved disagreements.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1000" height="850" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="square" stroke-linejoin="miter">
    <rect x="310" y="35" width="380" height="70"/>
    <path d="M500 105 V140 M190 140 H810 M190 140 V185 M500 140 V185 M810 140 V185"/>
    <path d="M190 173 V185 M500 173 V185 M810 173 V185" marker-end="url(#arrow)"/>

    <rect x="60" y="185" width="260" height="130"/>
    <rect x="370" y="185" width="260" height="130"/>
    <rect x="680" y="185" width="260" height="130"/>
    <rect x="85" y="230" width="210" height="60"/>
    <rect x="395" y="230" width="210" height="60"/>
    <rect x="705" y="230" width="210" height="60"/>

    <path d="M190 315 V355 H810 V315 M500 315 V420"/>
    <path d="M500 408 V420" marker-end="url(#arrow)"/>

    <rect x="60" y="420" width="880" height="180"/>
    <rect x="85" y="490" width="245" height="65"/>
    <rect x="377.5" y="490" width="245" height="65"/>
    <rect x="670" y="490" width="245" height="65"/>
    <path d="M940 535 H975 V390 H900 V420" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

    <path d="M500 600 V690" marker-end="url(#arrow)"/>
    <rect x="260" y="690" width="480" height="95"/>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle">
    <text x="500" y="64">Question</text>
    <text x="500" y="88" font-size="17">+ shared context</text>
    <rect x="380" y="149" width="240" height="26" fill="#fff"/>
    <text x="500" y="168" font-size="16">2-5 models; three shown</text>

    <text x="190" y="214">Model A</text>
    <text x="500" y="214">Model B</text>
    <text x="810" y="214">Model C</text>
    <text x="190" y="267" font-size="18">Independent opinion</text>
    <text x="500" y="267" font-size="18">Independent opinion</text>
    <text x="810" y="267" font-size="18">Independent opinion</text>

    <rect x="315" y="372" width="370" height="28" fill="#fff"/>
    <text x="500" y="392" font-size="17">All opinions + latest earlier positions</text>
    <text x="970" y="377" font-size="16" text-anchor="end">Repeat if needed</text>

    <text x="500" y="448">Peer review</text>
    <text x="500" y="473" font-size="16">The same frozen packet for every active member</text>
    <text x="207.5" y="516" font-size="17">Model A reviews</text>
    <text x="207.5" y="540" font-size="17">all earlier positions</text>
    <text x="500" y="516" font-size="17">Model B reviews</text>
    <text x="500" y="540" font-size="17">all earlier positions</text>
    <text x="792.5" y="516" font-size="17">Model C reviews</text>
    <text x="792.5" y="540" font-size="17">all earlier positions</text>
    <text x="500" y="581" font-size="16">Finished members leave their last position available to the others.</text>

    <rect x="305" y="628" width="390" height="29" fill="#fff"/>
    <text x="500" y="649" font-size="17">All active members finished or limit reached</text>
    <text x="500" y="723">Final answer</text>
    <text x="500" y="751" font-size="17">The selected model synthesizes the council</text>
    <text x="500" y="774" font-size="17">in the original chat</text>
  </g>
  <text x="500" y="826" text-anchor="middle" fill="#111" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">One answer; unresolved disagreements stay visible.</text>
</svg>
