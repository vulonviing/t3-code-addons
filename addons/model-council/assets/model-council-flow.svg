<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" role="img" aria-labelledby="title description">
  <title id="title">Model Council: independent opinions, peer review, and final synthesis</title>
  <desc id="description">One question and the same frozen context go to two to five models; three are shown. Each model gives an independent opinion. Active members review the initial opinions and the latest earlier position of every member, using the same frozen packet. Review rounds repeat while needed, until all active members finish or the configured round limit is reached. The model selected in the original chat synthesizes one final answer, preserving unresolved disagreements.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #767676; font-size: 12.5px; }
    .b { font-weight: 700; font-size: 13px; }
    .ac { fill: #8467ee; }
    .box { fill: none; stroke: #858585; stroke-width: 1; }
    .abox { fill: none; stroke: #8467ee; stroke-width: 1; }
    .ar { fill: none; stroke: #858585; stroke-width: 1; }
    .lp { fill: none; stroke: #8467ee; stroke-width: 1; stroke-dasharray: 3 3; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L6 4 L1.5 6.5" fill="none" stroke="#858585" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ahc" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 L6 4 L1.5 6.5" fill="none" stroke="#8467ee" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect class="box" x="212" y="8" width="300" height="28" rx="6"/>
  <text class="c" x="362" y="27"><tspan class="b">Question</tspan><tspan dx="8">+ shared context</tspan></text>
  <path class="ar" d="M362 36 V54 M222 54 H502"/>
  <path class="ar" d="M222 54 V72" marker-end="url(#ah)"/>
  <path class="ar" d="M362 54 V72" marker-end="url(#ah)"/>
  <path class="ar" d="M502 54 V72" marker-end="url(#ah)"/>
  <text x="12" y="58">2–5 models; three shown</text>
  <text class="b" x="12" y="90">1  Independent</text>
  <text x="12" y="107">opinions</text>
  <rect class="box" x="156" y="72" width="132" height="44" rx="6"/>
  <text class="c b" x="222" y="90">Model A</text>
  <text class="c" x="222" y="107">opinion</text>
  <rect class="box" x="296" y="72" width="132" height="44" rx="6"/>
  <text class="c b" x="362" y="90">Model B</text>
  <text class="c" x="362" y="107">opinion</text>
  <rect class="box" x="436" y="72" width="132" height="44" rx="6"/>
  <text class="c b" x="502" y="90">Model C</text>
  <text class="c" x="502" y="107">opinion</text>
  <path class="ar" d="M222 116 V134 M362 116 V134 M502 116 V134 M222 134 H502"/>
  <path class="ar" d="M222 134 V156" marker-end="url(#ah)"/>
  <path class="ar" d="M362 134 V156" marker-end="url(#ah)"/>
  <path class="ar" d="M502 134 V156" marker-end="url(#ah)"/>
  <text x="12" y="138">One shared packet</text>
  <rect class="lp" x="150" y="146" width="424" height="98" rx="8"/>
  <text class="b" x="12" y="178">2  Peer review</text>
  <text x="12" y="195">each round</text>
  <text x="12" y="212">Each member may</text>
  <text x="12" y="229">finish early</text>
  <rect class="box" x="156" y="156" width="132" height="44" rx="6"/>
  <text class="c b" x="222" y="174">Model A</text>
  <text class="c" x="222" y="191">reviews</text>
  <rect class="box" x="296" y="156" width="132" height="44" rx="6"/>
  <text class="c b" x="362" y="174">Model B</text>
  <text class="c" x="362" y="191">reviews</text>
  <rect class="box" x="436" y="156" width="132" height="44" rx="6"/>
  <text class="c b" x="502" y="174">Model C</text>
  <text class="c" x="502" y="191">reviews</text>
  <text class="c" x="362" y="220">Members review the initial opinions and the latest</text>
  <text class="c" x="362" y="236">earlier position of every member.</text>
  <path class="lp" d="M574 232 H586 Q592 232 592 226 V168 Q592 162 586 162 H576" marker-end="url(#ahc)"/>
  <text class="e ac" x="592" y="262">Repeat if needed</text>
  <path class="ar" d="M362 244 V274" marker-end="url(#ah)"/>
  <text x="12" y="262">Finished or round limit reached</text>
  <rect class="abox" x="156" y="276" width="412" height="46" rx="6"/>
  <text class="c b ac" x="362" y="295">Final answer</text>
  <text class="c" x="362" y="312">The chat's selected model synthesizes the council</text>
  <text class="c" x="362" y="347">Every active member gets the same frozen packet.</text>
  <text class="c" x="362" y="364">One answer; unresolved disagreements stay visible.</text>
</svg>
